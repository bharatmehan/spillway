[project]
name = "spillway"
version = "0.0.1"
description = "Congestion control for language model API traffic"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Bharat Mehan", email = "40287314+bharatmehan@users.noreply.github.com" },
]
keywords = [
    "admission-control",
    "concurrency",
    "congestion-control",
    "llm",
    "rate-limiting",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bharatmehan/spillway"
Repository = "https://github.com/bharatmehan/spillway"
Changelog = "https://github.com/bharatmehan/spillway/blob/main/CHANGELOG.md"
Issues = "https://github.com/bharatmehan/spillway/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
# One source of truth for the tool version, read both by uv locally and by the setup action
# in continuous integration. Without it, a contributor's uv and the one in the workflow can
# be months apart, and the promise that a green `just check` means a green build is only
# true by luck. The lockfile is used frozen, so the resolver version is load bearing.
required-version = ">=0.12.5,<0.13"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # blocking calls in async code
    "B",      # bugbear
    "C4",     # comprehensions
    "D",      # docstrings
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import order
    "N",      # naming
    "PIE",    # misc lints
    "PTH",    # pathlib over os.path
    "RET",    # return statements
    "RUF",    # ruff specific
    "S",      # security
    "SIM",    # simplify
    "T20",    # print statements
    "TID",    # tidy imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# ARG: a test double implementing a protocol has to accept the whole signature
# whether or not that particular double looks at every argument.
"tests/**" = ["ANN", "ARG", "D", "S101"]
# The exception names are public API and read better in an except clause without
# a suffix: `except AdmissionDenied` says what happened, `AdmissionDeniedError`
# only says that something went wrong.
"src/spillway/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --strict-config --doctest-modules"
markers = [
    "redis: needs a running coordination store",
    "slow: takes more than a second",
    "integration: crosses a process or network boundary",
    "bench: measures rather than asserts",
]
