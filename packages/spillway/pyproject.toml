[project]
name = "spillway"
version = "0.0.1"
description = "Congestion control for language model API traffic"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Bharat Mehan", email = "40287314+bharatmehan@users.noreply.github.com" },
]
keywords = [
    "admission-control",
    "concurrency",
    "congestion-control",
    "llm",
    "rate-limiting",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bharatmehan/spillway"
Repository = "https://github.com/bharatmehan/spillway"
Changelog = "https://github.com/bharatmehan/spillway/blob/main/CHANGELOG.md"
Issues = "https://github.com/bharatmehan/spillway/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spillway"
module-root = "src"
